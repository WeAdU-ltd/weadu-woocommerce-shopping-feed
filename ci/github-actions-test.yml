# Copy this file to .github/workflows/test.yml to run the tests on GitHub Actions.
# It is kept here because the token that opened this pull request cannot write workflow files.

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: sh test.sh
